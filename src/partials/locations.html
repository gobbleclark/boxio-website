<div class="grid grid-2 reveal-stagger">
  <article class="card loc-card">
    <div class="map"><iframe title="Map of Boxio's Utah fulfillment center" src="{{ut_embed}}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
    <div class="body">
      <span class="tag">Serves the West</span>
      <h3 style="margin-top:12px">Utah Fulfillment Center</h3>
      <address>{{ut_street}}<br>{{ut_city}}, {{ut_state}} {{ut_zip}}<br><a href="tel:{{ut_tel}}">{{ut_phone}}</a></address>
      <div class="actions">
        <a class="btn btn-primary btn-sm" href="{{ut_path}}">Utah 3PL details</a>
        <a class="btn btn-ghost btn-sm" href="{{ut_maps}}" target="_blank" rel="noopener">Directions</a>
      </div>
    </div>
  </article>
  <article class="card loc-card">
    <div class="map"><iframe title="Map of Boxio's Florida fulfillment center" src="{{fl_embed}}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
    <div class="body">
      <span class="tag">Serves the Southeast &amp; East</span>
      <h3 style="margin-top:12px">Florida Fulfillment Center</h3>
      <address>{{fl_street}}<br>{{fl_city}}, {{fl_state}} {{fl_zip}}<br><a href="tel:{{fl_tel}}">{{fl_phone}}</a></address>
      <div class="actions">
        <a class="btn btn-primary btn-sm" href="{{fl_path}}">Florida 3PL details</a>
        <a class="btn btn-ghost btn-sm" href="{{fl_maps}}" target="_blank" rel="noopener">Directions</a>
      </div>
    </div>
  </article>
</div>
